<title>OpsNest Financial Intelligence System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: demo strip on top, navy brand sidebar left, working area right; collapses to a top nav on phones.
   Brand: OpsNest navy + teal, Plus Jakarta Sans display, Source Sans 3 body, IBM Plex Mono for money. */
:root{
  --navy:#0B1B33; --navy2:#12325C; --teal:#19D3C5; --side-fg:#B9C8DE; --side-line:rgba(255,255,255,.12);
  --bg:#F2F6FA; --surface:#FFFFFF; --surface2:#F6F9FC; --fg:#0B1B33; --muted:#52627A; --line:#D7E0EA;
  --accent:#0A7F77; --accent-bg:#E1F4F2; --pos:#0FA89C; --neg:#D9483B; --neg-bg:#FBE4E1;
  --warn:#9A6212; --warn-bg:#FDF1DC; --future:#CBD5E1; --btn:#0B1B33; --btn-fg:#FFFFFF; --overlay:rgba(11,27,51,.45);
  --f-display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07111F; --surface:#0E1E37; --surface2:#0B192E; --fg:#E6EDF7; --muted:#9BAEC9; --line:#203A5E;
  --accent:#19D3C5; --accent-bg:#10304A; --pos:#19D3C5; --neg:#F27D70; --neg-bg:#3A1E27;
  --warn:#F2B755; --warn-bg:#3A2E16; --future:#2F4668; --btn:#19D3C5; --btn-fg:#0B1B33; --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111F; --surface:#0E1E37; --surface2:#0B192E; --fg:#E6EDF7; --muted:#9BAEC9; --line:#203A5E;
  --accent:#19D3C5; --accent-bg:#10304A; --pos:#19D3C5; --neg:#F27D70; --neg-bg:#3A1E27;
  --warn:#F2B755; --warn-bg:#3A2E16; --future:#2F4668; --btn:#19D3C5; --btn-fg:#0B1B33; --overlay:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font:500 .7rem/1.2 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.55rem 1rem;border-radius:8px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btn-fg);font:600 .9rem var(--f-display);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:.3rem .65rem;font-size:.8rem}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* demo strip */
.strip{background:#06101F;color:#D5E0EE;font-size:.84rem;padding:8px 16px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.strip b{color:var(--teal);font:600 .72rem var(--f-num);letter-spacing:.12em}
.strip .sp{flex:1}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#D5E0EE;padding:4px 10px;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--teal);color:#0B1B33;font-weight:700}
.strip .sbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:4px 10px;font-size:.8rem}

.word{font:800 1.2rem/1 var(--f-display)}
.word i{font-style:normal;color:var(--teal)}

/* login */
.login{min-height:100vh;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:40px 16px;display:grid;place-items:center}
.login-card{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:start;color:#fff}
.login-card>*{min-width:0}
.login h1{font-size:clamp(1.6rem,3.4vw,2.3rem);margin-top:22px}
.login .lead{color:var(--side-fg);margin-top:12px;max-width:30em}
.co{margin-top:20px;font:400 .8rem var(--f-num);color:var(--side-fg);border-left:2px solid var(--teal);padding-left:10px}
.roles{display:grid;gap:12px}
.role{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;text-align:left;width:100%}
.role:hover{border-color:var(--teal)}
.role .rn{font:600 1rem var(--f-display)}
.role .rd{color:var(--muted);font-size:.88rem;grid-column:1}
.role .rc{font:400 .76rem var(--f-num);color:var(--muted);grid-column:1}
.role .go{grid-row:1/4;grid-column:2;font:600 .85rem var(--f-display);color:var(--accent)}
.manual{background:rgba(255,255,255,.06);border:1px solid var(--side-line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.manual label{color:var(--side-fg)}
.manual input{background:#fff;color:#0B1B33}
.manual .err{grid-column:1/-1;color:#FFB4AA;font-size:.88rem}

/* app shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.app>*{min-width:0}
.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:var(--side-fg);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.side .prod{font:500 .74rem var(--f-num);letter-spacing:.06em;color:var(--side-fg);margin-top:-8px;padding-left:46px}
.nav{display:grid;gap:2px}
.nav button{background:transparent;border:0;color:var(--side-fg);text-align:left;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:.93rem}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(25,211,197,.14);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--teal)}
.badge{background:var(--teal);color:#0B1B33;border-radius:99px;font:600 .7rem var(--f-num);padding:1px 7px}
.side .who{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;font-size:.85rem;display:grid;gap:8px}
.side .who b{color:#fff;display:block}
.side select{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--side-line);border-radius:8px;padding:6px;font:inherit;font-size:.82rem;width:100%}
.side select option{color:#0B1B33}
.side .out{background:transparent;border:1px solid var(--side-line);color:#fff;border-radius:8px;padding:6px}
main{padding:24px 28px 60px;min-width:0;display:grid;gap:20px;align-content:start}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:4px;max-width:44rem}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel>h2+*{margin-top:12px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2>*{min-width:0}

/* forms */
label{display:grid;gap:4px;font-weight:600;font-size:.82rem;min-width:0}
input,select,textarea{font:400 .95rem var(--f-body);padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);width:100%;min-width:0}
input[readonly]{background:transparent;border-style:dashed;font-family:var(--f-num)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form .w2{grid-column:span 2}
.form .full{grid-column:1/-1}
.form-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ferr{color:var(--neg);font-size:.88rem;font-weight:600}
.hint{font-size:.85rem;color:var(--muted)}
.calc{grid-column:1/-1;display:flex;gap:10px 28px;flex-wrap:wrap;background:var(--accent-bg);border-radius:10px;padding:10px 14px;font-size:.9rem}
.calc b{font-family:var(--f-num);font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:400}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400;font-size:.9rem}
.checks input{width:auto}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .68rem var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2);white-space:nowrap}
td.r,th.r{text-align:right}
td.m{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.cx td{color:var(--muted)}
tr.cx td.m{text-decoration:line-through}
.empty{padding:22px;text-align:center;color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font:600 .72rem var(--f-body);white-space:nowrap}
.p-active{background:var(--accent-bg);color:var(--accent)}
.p-req{background:var(--warn-bg);color:var(--warn)}
.p-cx{background:var(--neg-bg);color:var(--neg)}
.p-pend{background:var(--warn-bg);color:var(--warn)}
.more{display:flex;justify-content:center;padding-top:12px}

/* dashboard */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-weight:600}
.banner.red{background:var(--neg-bg);color:var(--neg)}
.banner.green{background:var(--accent-bg);color:var(--accent)}
.banner .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;color:var(--fg);display:grid;gap:4px;min-width:0}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font:500 1.3rem var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v.neg{color:var(--neg)}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi .s u{text-decoration:none;color:var(--accent);font-weight:600}
svg text{fill:var(--muted);font:10px var(--f-num)}
svg .pos{fill:var(--pos)} svg .neg{fill:var(--neg)} svg .fut{fill:var(--future)} svg .base{stroke:var(--line)}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover+rect,svg g:hover rect.bar{opacity:.75}
svg text.today{fill:var(--fg);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:9.5rem 1fr 7.5rem;gap:10px;align-items:center;font-size:.88rem}
.hb .t{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hb .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hb .t i.pay{background:var(--navy2)}
:root[data-theme="dark"] .hb .t i.pay{background:#5B7FB0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hb .t i.pay{background:#5B7FB0}}
.hb .t i.tax{background:var(--muted)}
.hb .v{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hb button{background:none;border:0;padding:0;color:var(--fg);text-align:left;font:inherit}
.hb button:hover{color:var(--accent);text-decoration:underline}
.divider{border-top:1px dashed var(--line);margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:9rem;font-size:.85rem}
.chip b{font:500 1.1rem var(--f-num)}
.chip.red{border-color:var(--neg);background:var(--neg-bg)}
.chip.red b{color:var(--neg)}
.vatbox{display:grid;gap:8px;font-size:.9rem}
.vatbox div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.vatbox div:last-child{border:0;font-weight:700}
.vatbox span:last-child{font-family:var(--f-num)}

/* modal, toast, guide */
.ov{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;max-width:min(860px,100%);width:100%;max-height:88vh;overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal.sm{max-width:480px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-left:4px solid var(--teal);padding:12px 16px;border-radius:10px;max-width:min(560px,calc(100% - 32px));z-index:60;font-size:.92rem;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.guide{position:fixed;right:16px;top:58px;width:340px;max-width:calc(100% - 32px);max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:40;box-shadow:0 24px 50px -20px rgba(0,0,0,.45);display:grid;gap:12px}
.guide ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:g}
.guide li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;counter-increment:g}
.guide li.done{opacity:.6}
.guide li h3::before{content:counter(g) ". ";color:var(--accent)}
.guide li p{font-size:.86rem;color:var(--muted)}
.guide .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide .row label{display:flex;gap:6px;align-items:center;font-weight:400;font-size:.82rem}
.guide .row input{width:auto}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:2px 6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:column;gap:10px;padding:12px 16px}
  .side .prod{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}

}

/* Force the mobile layout on phones. With the browser's "Desktop site" option the page is laid out

var wantDesktop=false;

  coarse=coarse||(navigator.maxTouchPoints||0)>0;var sw=Math.min(window.screen.width||0,window.screen.height||0);return coarse&&sw>0&&sw<600;}

 JCB:'JCB hire, half day','Pickup Truck':'Pickup truck hire, daily','Water Tanker':'Water tanker delivery',Tipper:'Tipper hire for debris removal','Hire - Tools':'Drill and grinder hire',Tanker:'Sewage tanker service',Shovel:'Shovel loader hire',
 Food:'Staff meals',Taxi:'Taxi for technicians',Mobile:'Mobile recharge, supervisors',Bus:'Staff bus transport',Car:'Car allowance',Cookware:'Camp kitchen items','Cookware/Kitchen Equipment':'Camp kitchen items',Furniture:'Site office chairs',Rent:'Staff accommodation'};

/* ---------- utils ---------- */
function pad(n,w){n=String(n);while(n.length<w)n='0'+n;return n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+(a[2]||1));}
var TODAY=ymd(new Date());
var CURM=TODAY.slice(0,7);
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function mlabel(m){var d=pd(m);return MONL[d.getMonth()]+' '+d.getFullYear();}
function dlabel(s){var d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ref(id){return 'TXN-'+pad(id,6);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function $(id){return document.getElementById(id);}

function fmt(v){return new Intl.NumberFormat(R.locale,{minimumFractionDigits:R.dec,maximumFractionDigits:R.dec}).format(v||0);}
function fmtS(v){var a=Math.abs(v),s=v<0?'−':'';
  if(R.cur==='INR'){if(a>=1e7)return s+(a/1e7).toFixed(1)+' Cr';if(a>=1e5)return s+(a/1e5).toFixed(1)+' L';if(a>=1e3)return s+(a/1e3).toFixed(1)+'k';return s+a.toFixed(0);}
  if(a>=1e3)return s+(a/1e3).toFixed(1)+'k';return s+a.toFixed(0);}

function spread(total,days){var f=Math.pow(10,R.dec),T=Math.round(total*f),n=days.length,per=Math.floor(T/n),a=days.map(function(){return per;});a[n-1]+=T-per*n;return a.map(function(x){return x/f;});}

/* ---------- seed ---------- */

  return fetch('/api'+path,{method:method,headers:h,body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok){var e=new Error(j.error||'Something went wrong. Try again.');e.status=r.status;throw e;}return j;});});}

function pendingIds(){var s={};D.reqs.forEach(function(q){if(q.status==='Pending')q.txIds.forEach(function(i){s[i]=q.id;});});return s;}

function rowsOf(list){var P=pendingIds(),out=[],G={};
  list.forEach(function(t){if(t.group){var g=G[t.group];if(!g){g=G[t.group]={grp:true,id:t.id,ids:[],date:t.date.slice(0,7),site:t.site,parent:t.parent,sub:t.sub,party:t.party,doc:'',desc:t.desc,net:0,vat:0,gross:0,user:t.user,type:t.type,kind:t.kind,status:t.status,st:null,entered:t.entered};out.push(g);}
      g.ids.push(t.id);g.net+=t.net;g.vat+=t.vat;g.gross+=t.gross;g.id=Math.min(g.id,t.id);if(t.status==='Active')g.status='Active';}

  out.forEach(function(x){x.net=rnd(x.net);x.vat=rnd(x.vat);x.gross=rnd(x.gross);var anyP=x.ids.some(function(i){return P[i];});x.st=x.status==='Cancelled'?'Cancelled':(anyP?'Requested':'Active');});

/* ---------- dashboard ---------- */
function inScope(t,siteSel,m){return t.status==='Active'&&(siteSel==='all'||t.site===+siteSel)&&t.date.slice(0,7)===m;}
function dashData(siteSel,m){
  var L=D.tx.filter(function(t){return inScope(t,siteSel,m);});
  var o={L:L,rev:0,exp:0,inTax:0,outTax:0,par:{'Purchase':0,'Equipment Hire':0,'Allowance':0},pay:0,revT:{},vend:{},day:{}};
  REVTYPES.forEach(function(x){o.revT[x]=0;});
  L.forEach(function(t){var dn=o.day[t.date]||(o.day[t.date]=0);
    if(t.type==='Revenue'){o.rev+=t.net;o.outTax+=t.vat;o.revT[t.sub]=(o.revT[t.sub]||0)+t.net;o.day[t.date]=dn+t.net;}
    else{o.exp+=t.net;o.inTax+=t.vat;o.day[t.date]=dn-t.net;if(o.par[t.parent]!=null)o.par[t.parent]+=t.net;else o.pay+=t.net;
      if(t.kind==='ops')o.vend[t.party]=(o.vend[t.party]||0)+t.net;}});
  return o;}
function payStatus(m){return D.sites.filter(function(s){return s.status==='Active';}).map(function(s){return {s:s,ok:D.tx.some(function(t){return t.status==='Active'&&t.site===s.id&&t.parent==='Manpower'&&t.date.slice(0,7)===m;})};});}

  var ds=S.dash,o=dashData(ds.site,ds.month),net=o.rev-o.exp,tax=o.outTax-o.inTax;
  var ps=payStatus(ds.month).filter(function(x){return ds.site==='all'||x.s.id===+ds.site;});

    hb('Payroll &amp; Overheads',o.pay,'pay','pay')+hb('Input '+R.tax,o.inTax,'tax','intax')+'</div></section>';
  var maxR=Math.max(o.revT['Manpower Supply'],o.revT['Material & Services Supply'],o.outTax,1);
  function rb(lbl,v,cls,act){return '<div class="hb"><button type="button" data-act="drill" data-arg="'+act+'">'+lbl+'</button><div class="t"><i class="'+(cls||'')+'" style="width:'+(v/maxR*100).toFixed(1)+'%"></i></div><span class="v">'+fmt(v)+'</span></div>';}
  var vend=Object.keys(o.vend).map(function(k){return [k,o.vend[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  var rev='<section class="panel"><div class="ph"><h2>Revenue and top vendors</h2><span class="label">'+R.cur+', net</span></div><div class="hbars">'+
    rb('Manpower Supply',o.revT['Manpower Supply'],'','r:Manpower Supply')+rb('Material &amp; Services',o.revT['Material & Services Supply'],'','r:Material & Services Supply')+rb('Output '+R.tax,o.outTax,'tax','outtax')+'</div>'+
    '<div class="tw" style="margin-top:14px"><table><thead><tr><th>Top vendors by spend</th><th class="r">Net</th></tr></thead><tbody>'+
    (vend.length?vend.map(function(v){return '<tr><td><button type="button" class="link" data-act="drill" data-arg="v:'+esc(v[0])+'">'+esc(v[0])+'</button></td><td class="m r">'+fmt(v[1])+'</td></tr>';}).join(''):'<tr><td colspan="2" class="empty">No vendor spend this month.</td></tr>')+'</tbody></table></div></section>';
  var todayOps=D.tx.filter(function(t){return t.date===TODAY&&t.kind==='ops'&&t.status==='Active'&&(ds.site==='all'||t.site===+ds.site);}).length;

  var vat='<section class="panel"><div class="ph"><h2>'+R.tax+' position</h2><span class="label">'+mlabel(ds.month)+'</span></div><div class="vatbox">'+

function cockpit(o,m){
  var d0=pd(m+'-01'),n=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate(),vals=[],mx=1;
  for(var i=1;i<=n;i++){var ds=m+'-'+pad(i,2);var v=o.day[ds]||0;vals.push([ds,v]);if(ds<=TODAY)mx=Math.max(mx,Math.abs(v));}
  var L=58,W=L+n*22+6,H=210,mid=100,h=86,s='';
  s+='<line class="base" x1="'+L+'" x2="'+(W-4)+'" y1="'+mid+'" y2="'+mid+'" stroke-width="1"/>';
  s+='<text x="'+(L-6)+'" y="'+(mid-h+4)+'" text-anchor="end">+'+fmtS(mx)+'</text><text x="'+(L-6)+'" y="'+(mid+4)+'" text-anchor="end">0</text><text x="'+(L-6)+'" y="'+(mid+h+4)+'" text-anchor="end">'+fmtS(-mx)+'</text>';
  vals.forEach(function(p,i){var x=L+i*22+3,fut=p[0]>TODAY,bh=fut?3:Math.max(Math.abs(p[1])/mx*h,p[1]?2:0),y=fut?mid-1.5:(p[1]>=0?mid-bh:mid);
    var cls=fut?'fut':(p[1]>=0?'pos':'neg');
    s+='<g'+(fut?'':' data-act="drill" data-arg="d:'+p[0]+'" style="cursor:pointer"')+'><title>'+dlabel(p[0])+': '+(fut?'not reached yet':fmt(p[1])+' '+R.cur)+'</title><rect class="hit" x="'+(x-3)+'" y="10" width="22" height="'+(H-36)+'"/><rect class="bar '+cls+'" x="'+x+'" y="'+y.toFixed(1)+'" width="16" height="'+bh.toFixed(1)+'" rx="2"/></g>';
    var dn=i+1;if(dn===1||dn%5===0||p[0]===TODAY)s+='<text x="'+(x+8)+'" y="'+(H-8)+'" text-anchor="middle"'+(p[0]===TODAY?' class="today"':'')+'>'+(p[0]===TODAY?'Today':dn)+'</text>';});
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:560px;display:block" role="img" aria-label="Daily net cash flow for '+mlabel(m)+'">'+s+'</svg></div>';
}
function drill(arg){
  var ds=S.dash,L=D.tx.filter(function(t){return inScope(t,ds.site,ds.month);}),title='';
  var k=arg.split(':')[0],v=arg.slice(k.length+1);
  if(k==='rev'){L=L.filter(function(t){return t.type==='Revenue';});title='Revenue';}
  else if(k==='exp'){L=L.filter(function(t){return t.type==='Expense';});title='Expenses';}
  else if(k==='all'){title='All entries (net cash flow)';}
  else if(k==='tax'||k==='intax'||k==='outtax'){L=L.filter(function(t){return t.vat&&(k==='tax'||(k==='intax'?t.type==='Expense':t.type==='Revenue'));});title=k==='intax'?'Input '+R.tax:k==='outtax'?'Output '+R.tax:'Entries carrying '+R.tax;}
  else if(k==='p'){L=L.filter(function(t){return t.parent===v;});title=v;}
  else if(k==='pay'){L=L.filter(function(t){return t.kind==='pay';});title='Payroll & Overheads';}
  else if(k==='r'){L=L.filter(function(t){return t.type==='Revenue'&&t.sub===v;});title=v;}
  else if(k==='v'){L=L.filter(function(t){return t.kind==='ops'&&t.party===v;});title='Vendor: '+v;}
  else if(k==='d'){L=D.tx.filter(function(t){return t.status==='Active'&&(ds.site==='all'||t.site===+ds.site)&&t.date===v;});title=dlabel(v);}
  var rows=sortDesc(rowsOf(L)),inn=0,out=0;
  L.forEach(function(t){if(t.type==='Revenue')inn+=t.net;else out+=t.net;});
  var sc=ds.site==='all'?'All sites':site(+ds.site).name;
  modal('<div class="ph"><div><h2>'+esc(title)+'</h2><p class="hint">'+esc(sc)+' · '+(k==='d'?'':mlabel(ds.month)+' · ')+L.length+' transactions'+(rows.length!==L.length?' shown as '+rows.length+' rows (payroll grouped by month)':'')+'</p></div><button class="x" type="button" data-act="close" aria-label="Close">×</button></div>'+
    '<div class="calc"><span>In <b>'+fmt(inn)+'</b></span><span>Out <b>'+fmt(out)+'</b></span><span>Net <b>'+fmt(inn-out)+'</b> '+R.cur+'</span></div>'+table(rows.slice(0,200),{site:true})+(rows.length>200?'<p class="hint">Showing the latest 200 rows. All Entries has the full list.</p>':''),'');
}

/* ---------- tables ---------- */
function table(rows,opt){
  opt=opt||{};
  if(!rows.length)return '<div class="tw"><div class="empty">'+(opt.empty||'No entries match these filters.')+'</div></div>';
  return '<div class="tw"><table><thead><tr><th>Ref</th><th>Date</th>'+(opt.site?'<th>Site</th>':'')+'<th>Category</th><th>Party</th><th>Doc no.</th><th class="r">Net</th><th class="r">'+R.tax+'</th><th class="r">Gross</th><th>Status</th>'+(opt.act?'<th></th>':'')+'</tr></thead><tbody>'+
   rows.map(function(x){var a='';if(opt.act)a='<td>'+opt.act(x)+'</td>';
    return '<tr class="'+(x.st==='Cancelled'?'cx':'')+'"><td class="m">'+ref(x.id)+(x.grp?'<br><span class="hint">'+x.ids.length+' daily rows</span>':'')+'</td><td class="m">'+(x.grp?mlabel(x.date):x.date)+'</td>'+(opt.site?'<td>'+esc(site(x.site).location)+'</td>':'')+
     '<td>'+esc(x.parent)+' · '+esc(x.sub)+'</td><td>'+esc(x.party||'—')+(x.desc&&!x.grp?'<br><span class="hint">'+esc(x.desc)+'</span>':'')+'</td><td class="m">'+esc(x.doc||'—')+'</td><td class="m r">'+fmt(x.net)+'</td><td class="m r">'+fmt(x.vat)+'</td><td class="m r">'+fmt(x.gross)+'</td><td>'+pill(x.st)+'</td>'+a+'</tr>';}).join('')+'</tbody></table></div>';
}

function siteOpts(id,sel,withAll){var u=me();var list=D.sites.filter(function(s){return s.status==='Active'&&u.sites.indexOf(s.id)>=0;});
  return (withAll?'<option value="all">All my sites</option>':'')+list.map(function(s){return '<option value="'+s.id+'"'+(String(sel)===String(s.id)?' selected':'')+'>'+esc(s.name)+'</option>';}).join('');}

function myEntries(kind){
  var u=me(),f=S.my,P=pendingIds();

   '<label>Site<select id="my-site">'+siteOpts(null,f.site,true)+'</select></label><label>Status<select id="my-status">'+['all','Active','Requested','Cancelled'].map(function(s){return '<option value="'+s+'"'+(f.status===s?' selected':'')+'>'+(s==='all'?'All statuses':s)+'</option>';}).join('')+'</select></label>'+
   '<label style="flex:1;min-width:12rem">Search<input id="my-q" value="'+esc(f.q)+'" placeholder="Ref, vendor, bill no."></label></div>'+

   (total>f.n?'<div class="more"><button type="button" class="btn ghost sm" data-act="mymore">Show more</button></div>':'')+'</section>';

   list.map(function(x,i){return '<tr><td>'+esc(site(x.site).location)+'</td><td class="m">'+x.date+'</td><td>'+esc(x.sub)+'</td><td>'+esc(x.party)+'</td><td class="m">'+esc(x.doc||'—')+'</td><td class="m r">'+fmt(x.net)+'</td><td class="m r">'+fmt(x.vat)+'</td><td class="m r">'+fmt(x.gross)+'</td><td><button type="button" class="link" data-act="unpend" data-arg="'+which+':'+i+'">Remove</button></td></tr>';}).join('')+

  return '<div class="head"><div><h1>All Entries</h1><p>Every transaction across every site. Payroll and overheads show as one row per month. Cancelled entries stay on record and drop out of all totals.</p></div></div>'+
   '<section class="panel"><div class="controls" style="margin-bottom:12px">'+
   '<label>Site<select id="g-site"><option value="all">All sites</option>'+D.sites.map(function(s){return '<option value="'+s.id+'"'+(f.site==String(s.id)?' selected':'')+'>'+esc(s.location)+'</option>';}).join('')+'</select></label>'+
   '<label>Month<select id="g-month"><option value="all">All months</option>'+monthsInRange().map(function(m){return '<option value="'+m+'"'+(f.month===m?' selected':'')+'>'+mlabel(m)+'</option>';}).join('')+'</select></label>'+
   '<label>Category<select id="g-parent"><option value="all">All categories</option>'+parents.map(function(p){return '<option'+(f.parent===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></label>'+
   '<label>Status<select id="g-status">'+['all','Active','Requested','Cancelled'].map(function(s){return '<option value="'+s+'"'+(f.status===s?' selected':'')+'>'+(s==='all'?'All statuses':s)+'</option>';}).join('')+'</select></label>'+
   '<label style="flex:1;min-width:12rem">Search<input id="g-q" value="'+esc(f.q)+'" placeholder="Ref, party, doc no., person"></label></div>'+
   '<p class="hint" style="margin-bottom:8px">'+total+' rows</p>'+
   table(shown,{site:true,act:function(x){return x.st==='Cancelled'?'<button type="button" class="btn ghost sm" data-act="reinstate" data-arg="'+x.ids.join(',')+'">Reinstate</button>':'<button type="button" class="btn ghost sm" data-act="mgcx" data-arg="'+x.ids.join(',')+'">Cancel</button>';}})+
   (total>f.n?'<div class="more"><button type="button" class="btn ghost sm" data-act="ledmore">Show 60 more</button></div>':'')+'</section>';
}

/* ---------- cancellations ---------- */
function cxView(){
  function amtOf(q){return q.txIds.reduce(function(s,id){var t=D.tx.filter(function(x){return x.id===id;})[0];return s+(t?t.gross:0);},0);}
  function first(q){return D.tx.filter(function(x){return x.id===q.txIds[0];})[0]||{};}
  var pend=D.reqs.filter(function(q){return q.status==='Pending';}).reverse(),done=D.reqs.filter(function(q){return q.status!=='Pending';}).reverse();
  function row(q,act){var t=first(q);return '<tr><td class="m">CR-'+pad(q.id,4)+'</td><td>'+esc(user(q.by).name)+'<br><span class="hint">'+q.at+'</span></td><td>'+esc(q.reason)+'</td><td class="m">'+ref(t.id)+(q.txIds.length>1?' +'+(q.txIds.length-1):'')+'<br><span class="hint">'+esc(site(t.site).location)+' · '+esc(t.sub)+'</span></td><td class="m r">'+fmt(amtOf(q))+'</td><td>'+(act?'<div style="display:flex;gap:6px"><button type="button" class="btn sm" data-act="approve" data-arg="'+q.id+'">Approve</button><button type="button" class="btn ghost sm" data-act="reject" data-arg="'+q.id+'">Reject</button></div>':pill(q.status)+(q.reviewedBy?'<br><span class="hint">by '+esc(user(q.reviewedBy).name)+'</span>':''))+'</td></tr>';}
  var th='<thead><tr><th>Request</th><th>Requested by</th><th>Reason</th><th>Transactions</th><th class="r">Gross</th><th></th></tr></thead>';
  return '<div class="head"><div><h1>Cancellation Requests</h1><p>Clerks cannot delete entries. They request a cancellation with a reason, and you approve or reject it here. Approved entries drop out of every total.</p></div></div>'+
   '<section class="panel"><h2>Waiting for review ('+pend.length+')</h2>'+(pend.length?'<div class="tw">'+'<table>'+th+'<tbody>'+pend.map(function(q){return row(q,true);}).join('')+'</tbody></table></div>':'<div class="tw"><div class="empty">No requests waiting. Clerks raise them from their My entries list.</div></div>')+'</section>'+
   '<section class="panel"><h2>Reviewed</h2>'+(done.length?'<div class="tw"><table>'+th+'<tbody>'+done.map(function(q){return row(q,false);}).join('')+'</tbody></table></div>':'<div class="tw"><div class="empty">Nothing reviewed yet.</div></div>')+'</section>';
}

/* ---------- sites / users / password ---------- */
function sitesView(){
  var next='SITE-'+pad(D.sites.length+1,2);
  return '<div class="head"><div><h1>Sites</h1><p>An inactive site disappears from every data-entry dropdown. Its history stays in reports.</p></div></div>'+
   '<section class="panel"><div class="tw"><table><thead><tr><th>Code</th><th>Site</th><th>Location</th><th>Manager</th><th class="r">Budget, '+R.cur+'</th><th>Status</th><th></th></tr></thead><tbody>'+
   D.sites.map(function(s){return '<tr><td class="m">'+s.code+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.location)+'</td><td>'+esc(s.manager||'—')+'</td><td class="m r">'+(s.budget?fmt(s.budget):'—')+'</td><td>'+pill(s.status==='Active'?'Active':'Cancelled').replace('Cancelled','Inactive')+'</td><td><button type="button" class="btn ghost sm" data-act="sitetoggle" data-arg="'+s.id+'">'+(s.status==='Active'?'Deactivate':'Activate')+'</button></td></tr>';}).join('')+
   '</tbody></table></div></section><section class="panel"><h2>Add a site</h2><form class="form" id="f-site" novalidate style="margin-top:12px">'+
   '<label>Site code<input id="s-code" value="'+next+'"></label><label class="w2">Site name<input id="s-name" placeholder="City – Facility name"></label><label>Location<input id="s-loc"></label>'+
   '<label class="w2">Site manager<input id="s-mgr"></label><label class="w2">Annual budget, '+R.cur+'<input id="s-bud" inputmode="decimal"></label>'+
   '<div class="form-foot"><span class="ferr" id="s-err" role="alert"></span><button class="btn">Add site</button></div></form></section>';
}
function usersView(){
  return '<div class="head"><div><h1>Users</h1><p>Each person sees only the screens for their role and only the sites assigned to them. An inactive account cannot sign in.</p></div></div>'+
   '<section class="panel"><div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Sites</th><th>Status</th><th></th></tr></thead><tbody>'+
   D.users.map(function(u){return '<tr><td>'+esc(u.name)+'</td><td class="m">'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td>'+u.sites.map(function(i){return esc(site(i).location);}).join(', ')+'</td><td>'+pill(u.status==='Active'?'Active':'Cancelled').replace('Cancelled','Inactive')+'</td><td><div style="display:flex;gap:6px"><button type="button" class="btn ghost sm" data-act="usersites" data-arg="'+u.id+'">Edit sites</button>'+(u.id===S.user?'':'<button type="button" class="btn ghost sm" data-act="usertoggle" data-arg="'+u.id+'">'+(u.status==='Active'?'Deactivate':'Activate')+'</button>')+'</div></td></tr>';}).join('')+
   '</tbody></table></div></section><section class="panel"><h2>Add a user</h2><form class="form" id="f-user" novalidate style="margin-top:12px">'+
   '<label class="w2">Full name<input id="u-name"></label><label>Username<input id="u-user" autocomplete="off"></label><label>Password<input id="u-pass" type="text" autocomplete="off" placeholder="At least 8 characters"></label>'+
   '<label class="w2">Role<select id="u-role"><option>'+OPS+'</option><option>'+RP+'</option><option>'+M+'</option></select></label>'+
   '<div class="w2"><span class="label" style="display:block;margin-bottom:6px">Assigned sites</span><div class="checks">'+D.sites.filter(function(s){return s.status==='Active';}).map(function(s){return '<label><input type="checkbox" name="u-sites" value="'+s.id+'"> '+esc(s.location)+'</label>';}).join('')+'</div></div>'+
   '<div class="form-foot"><span class="hint">Passwords are stored as bcrypt hashes.</span><span class="ferr" id="u-err" role="alert"></span><button class="btn">Add user</button></div></form></section>';
}
function pwView(){return '<div class="head"><div><h1>Change Password</h1><p>Enter your current password, then the new one twice.</p></div></div>'+
  '<section class="panel" style="max-width:520px"><form class="form" id="f-pw" novalidate style="grid-template-columns:1fr"><label>Current password<input id="w-cur" type="password" autocomplete="current-password"></label><label>New password<input id="w-new" type="password" autocomplete="new-password"></label><label>Confirm new password<input id="w-con" type="password" autocomplete="new-password"></label><div class="form-foot"><span class="ferr" id="w-err" role="alert"></span><button class="btn">Change password</button></div></form></section>';}

/* ---------- modal, toast, guide ---------- */
var toastT;
function toast(msg){var old=document.querySelector('.toast');if(old)old.remove();var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove();},5200);}
var onOk=null;
function modal(html,cls){layer.innerHTML='<div class="ov" data-act="ovclose"><div class="modal '+(cls||'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';var f=layer.querySelector('textarea,input,select,button');if(f)f.focus();}
function closeModal(){layer.innerHTML='';onOk=null;}
function confirmBox(title,body,okLabel,fn,withReason,danger){onOk=fn;
  modal('<h2>'+esc(title)+'</h2><p class="muted">'+body+'</p>'+(withReason?'<label>Reason<textarea id="m-reason" rows="3" placeholder="'+esc(withReason)+'"></textarea></label><span class="ferr" id="m-err" role="alert"></span>':'')+
   '<div class="acts"><button type="button" class="btn ghost" data-act="close">Keep as is</button><button type="button" class="btn'+(danger?' danger':'')+'" data-act="ok">'+esc(okLabel)+'</button></div>','sm');}

/* ---------- actions ---------- */
function num(v){v=String(v||'').replace(/,/g,'').trim();if(!v)return NaN;return +v;}
function idsArg(a){return a.split(',').map(Number);}
function signOut(msg){TOKEN='';store('opsnest-token','');S.user=null;S.pend={ops:[],rev:[]};D.users=[];closeModal();render();if(msg)toast(msg);}
function fail(e,errId){if(e&&e.status===401&&S.user){signOut('Your session has ended. Please sign in again.');return;}
  if(errId&&$(errId))$(errId).textContent=e.message;else toast(e.message);}
function go(fn,ok,errId){if(S.sending)return;S.sending=true;
  return fn().then(function(r){return refresh().then(function(){render();if(ok)ok(r);});}).catch(function(e){fail(e,errId);}).then(function(){S.sending=false;});}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),arg=el.getAttribute('data-arg');
  if(a==='ovclose'){if(e.target===el)closeModal();return;}
  switch(a){
  case 'logout':signOut();break;
  case 'nav':S.screen=arg;S.my={site:'all',status:'all',q:'',n:25};render();window.scrollTo(0,0);break;
  case 'drill':drill(arg);break;
  case 'close':closeModal();break;
  case 'ok':if(onOk)onOk();break;
  case 'unpend':var p=arg.split(':');S.pend[p[0]].splice(+p[1],1);render();break;
  case 'submit':submitBatch(arg);break;
  case 'mymore':S.my.n+=25;render();break;
  case 'ledmore':S.led.n+=60;render();break;
  case 'reqcx':var ids=idsArg(arg);confirmBox('Request cancellation','Management will review this request. The entry stays in reports until it is approved.','Send request',function(){var r=$('m-reason').value.trim();if(r.length<5){$('m-err').textContent='Give a short reason so Management can decide.';return;}
      go(function(){return api('POST','/cancel-requests',{txIds:ids,reason:r});},function(){closeModal();toast('Cancellation requested for '+ref(Math.min.apply(null,ids))+'. Management will review it.');},'m-err');},'For example: bill entered twice');break;
  case 'mgcx':var ids2=idsArg(arg);confirmBox('Cancel this entry?','The entry stays on record and drops out of every total. You can reinstate it later.','Cancel entry',function(){var r=$('m-reason').value.trim();if(r.length<5){$('m-err').textContent='Add a reason for the audit trail.';return;}
      go(function(){return api('POST','/transactions/cancel',{ids:ids2,reason:r});},function(){closeModal();toast(ref(Math.min.apply(null,ids2))+' cancelled.');},'m-err');},'Reason for cancelling',true);break;
  case 'reinstate':var ids3=idsArg(arg);go(function(){return api('POST','/transactions/reinstate',{ids:ids3});},function(){toast(ref(Math.min.apply(null,ids3))+' reinstated.');});break;
  case 'approve':case 'reject':var qid=+arg,qq=D.reqs.filter(function(x){return x.id===qid;})[0];if(!qq)break;
    go(function(){return api('POST','/cancel-requests/'+qid+'/review',{decision:a});},function(){toast(a==='approve'?'Approved. '+qq.txIds.length+' transaction'+(qq.txIds.length>1?'s are':' is')+' now cancelled and out of all totals.':'Rejected. The entry stays active.');});break;
  case 'sitetoggle':go(function(){return api('POST','/sites/'+(+arg)+'/toggle');},function(r){toast(r.name+' is now '+r.status.toLowerCase()+'.');});break;
  case 'usertoggle':go(function(){return api('POST','/users/'+(+arg)+'/toggle');},function(r){toast(r.name+' is now '+r.status.toLowerCase()+'.');});break;
  case 'usersites':var uu=user(+arg);onOk=function(){var ch=[].slice.call(layer.querySelectorAll('input[name=e-sites]:checked')).map(function(c){return +c.value;});if(!ch.length){$('m-err').textContent='Pick at least one site.';return;}
      go(function(){return api('PUT','/users/'+uu.id+'/sites',{sites:ch});},function(){closeModal();toast('Sites updated for '+uu.name+'.');},'m-err');};
    modal('<h2>Sites for '+esc(uu.name)+'</h2><p class="muted">'+esc(uu.role)+' · only these sites appear in their entry forms.</p><div class="checks">'+D.sites.map(function(s){return '<label><input type="checkbox" name="e-sites" value="'+s.id+'"'+(uu.sites.indexOf(s.id)>=0?' checked':'')+'> '+esc(s.name)+'</label>';}).join('')+'</div><span class="ferr" id="m-err"></span><div class="acts"><button type="button" class="btn ghost" data-act="close">Close</button><button type="button" class="btn" data-act="ok">Save sites</button></div>','sm');break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&layer.innerHTML)closeModal();});
function submitBatch(which){var list=S.pend[which];if(!list.length)return;
  var rows=list.map(function(x){return {date:x.date,kind:x.kind,parent:x.parent,sub:x.sub,party:x.party,site:x.site,doc:x.doc,desc:x.desc,net:x.net,rate:x.rate};});
  go(function(){return api('POST','/transactions',{rows:rows});},function(r){S.pend[which]=[];render();
    toast(r.count+' entr'+(r.count>1?'ies':'y')+' saved as '+ref(r.first)+(r.count>1?' to '+ref(r.last):'')+'. The dashboard is updated.');});}
function liveGross(p){var n=num($(p+'-net').value),r=+$(p+'-rate').value;$(p+'-gross').value=isNaN(n)?fmt(0):fmt(rnd(n)+rnd(rnd(n)*r/100));}
function payCalc(){var m=$('p-month').value,wd=workingDays(m).length,sal=num($('p-salary').value)||0;var tot=['salary','rent','ins','misc'].reduce(function(s,k){return s+(num($('p-'+k).value)||0);},0);
  $('p-calc').firstChild.querySelector('b').textContent=wd;$('p-burn').textContent=fmt(wd?sal/wd:0);$('p-tot').textContent=fmt(tot);}
document.addEventListener('input',function(e){var id=e.target.id;
  if(id==='o-net')liveGross('o');else if(id==='r-net')liveGross('r');
  else if(/^p-(salary|rent|ins|misc)$/.test(id))payCalc();
  else if(id==='my-q'||id==='g-q'){clearTimeout(window.__q);var v=e.target.value;window.__q=setTimeout(function(){if(id==='my-q'){S.my.q=v;S.my.n=25;}else{S.led.q=v;S.led.n=60;}render();var f=$(id);if(f){f.focus();f.setSelectionRange(v.length,v.length);}},250);}});
document.addEventListener('change',function(e){var id=e.target.id,v=e.target.value;
  if(id==='d-site'){S.dash.site=v;render();}else if(id==='d-month'){S.dash.month=v;render();}
  else if(id==='o-cat'){if(v){var p=v.split('|');$('o-rate').value=R.rate(p[0],p[1]);liveGross('o');var d=$('o-desc');if(!d.value)d.placeholder=DESC[p[1]]||'';}}
  else if(id==='o-rate')liveGross('o');else if(id==='r-rate')liveGross('r');
  else if(id==='r-type'){$('r-rate').value=R.rate('Revenue',v);liveGross('r');}
  else if(id==='p-month'){S.payMonth=v;S.paySite=+$('p-site').value;render();}
  else if(id==='p-site'){S.paySite=+v;S.payMonth=$('p-month').value;render();}
  else if(id==='my-site'){S.my.site=v;S.my.n=25;render();}else if(id==='my-status'){S.my.status=v;S.my.n=25;render();}
  else if(/^g-(site|month|parent|status)$/.test(id)){S.led[id.slice(2)]=v;S.led.n=60;render();}
});
document.addEventListener('submit',function(e){var f=e.target;e.preventDefault();
  if(f.id==='f-login'){var err=$('l-err');err.hidden=true;var un=$('l-user').value.trim(),pw=$('l-pass').value;
    if(!un||!pw){err.hidden=false;err.textContent='Enter your username and password.';return;}
    api('POST','/login',{username:un,password:pw}).then(function(j){TOKEN=j.token;store('opsnest-token',TOKEN);return refresh();})
      .then(function(){S.screen=null;S.my={site:'all',status:'all',q:'',n:25};S.paySite=null;S.payMonth=null;S.pend={ops:[],rev:[]};render();window.scrollTo(0,0);})
      .catch(function(x){var e2=$('l-err');if(e2){e2.hidden=false;e2.textContent=x.message;}});}
  else if(f.id==='f-ops'){var err1=$('o-err'),cat=$('o-cat').value,n=num($('o-net').value),party=$('o-party').value.trim(),date=$('o-date').value;
    if(!$('o-site').value)return err1.textContent='You have no active sites assigned. Ask Management to assign one.';
    if(!date||date>TODAY)return err1.textContent='Choose a date up to today.';
    if(!cat)return err1.textContent='Choose a category.';if(!party)return err1.textContent='Enter the vendor name.';if(!(n>0))return err1.textContent='Enter a net amount greater than zero.';
    var c=cat.split('|'),r=+$('o-rate').value;S.pend.ops.push(makeTx({date:date,kind:'ops',type:'Expense',parent:c[0],sub:c[1],party:party,site:+$('o-site').value,user:S.user,doc:$('o-doc').value.trim(),desc:$('o-desc').value.trim()||DESC[c[1]]||'',net:n,rate:r}));render();toast('Line added. Submit the batch when you are done.');}
  else if(f.id==='f-rev'){var err2=$('r-err'),n2=num($('r-net').value),party2=$('r-party').value.trim(),doc=$('r-doc').value.trim(),date2=$('r-date').value;
    if(!$('r-site').value)return err2.textContent='You have no active sites assigned.';if(!date2||date2>TODAY)return err2.textContent='Choose a date up to today.';
    if(!party2)return err2.textContent='Enter the client name.';if(!doc)return err2.textContent='Enter the invoice number.';
    var dup=D.tx.some(function(t){return t.kind==='rev'&&t.status==='Active'&&t.doc.toLowerCase()===doc.toLowerCase();})||S.pend.rev.some(function(t){return t.doc.toLowerCase()===doc.toLowerCase();});
    if(dup)return err2.textContent='Invoice '+doc+' is already recorded. Check the number before adding it again.';
    if(!(n2>0))return err2.textContent='Enter a net amount greater than zero.';
    S.pend.rev.push(makeTx({date:date2,kind:'rev',type:'Revenue',parent:'Revenue',sub:$('r-type').value,party:party2,site:+$('r-site').value,user:S.user,doc:doc,desc:'',net:n2,rate:+$('r-rate').value}));render();toast('Invoice added. Submit the batch when you are done.');}
  else if(f.id==='f-pay'){var err3=$('p-err'),m=$('p-month').value,sid=+$('p-site').value,vals={};
    if(!sid)return err3.textContent='You have no active sites assigned.';
    var bad=false;['salary','rent','ins','misc'].forEach(function(k){var v=$('p-'+k).value.trim();if(!v){vals[k]=0;return;}var x=num(v);if(!(x>=0))bad=true;vals[k]=x;});
    if(bad)return err3.textContent='Amounts must be numbers.';if(!(vals.salary>0))return err3.textContent='Enter the total gross salary for the month.';
    err3.textContent='';
    go(function(){return api('POST','/payroll',{month:m,site:sid,vals:vals});},function(r){S.paySite=null;render();
      toast('Payroll for '+site(sid).location+', '+mlabel(m)+' saved: '+r.rows+' daily rows across '+r.days+' working days, '+ref(r.first)+' to '+ref(r.last)+'.');},'p-err');}
  else if(f.id==='f-site'){var e1=$('s-err'),code=$('s-code').value.trim().toUpperCase(),nm=$('s-name').value.trim();
    if(!code||!nm)return e1.textContent='Enter a site code and name.';
    var b=num($('s-bud').value);
    go(function(){return api('POST','/sites',{code:code,name:nm,location:$('s-loc').value.trim(),manager:$('s-mgr').value.trim(),budget:isNaN(b)?0:b});},function(){toast(nm+' added. Assign it to clerks under Users.');},'s-err');}
  else if(f.id==='f-user'){var e2=$('u-err'),nm2=$('u-name').value.trim(),un2=$('u-user').value.trim(),pw2=$('u-pass').value;var ch=[].slice.call(document.querySelectorAll('input[name=u-sites]:checked')).map(function(c){return +c.value;});
    if(!nm2||!un2)return e2.textContent='Enter a name and username.';
    if(pw2.length<8)return e2.textContent='Use a password of at least 8 characters.';if(!ch.length)return e2.textContent='Assign at least one site.';
    go(function(){return api('POST','/users',{name:nm2,username:un2,password:pw2,role:$('u-role').value,sites:ch});},function(){toast(nm2+' can now sign in as '+un2+'.');},'u-err');}
  else if(f.id==='f-pw'){var e3=$('w-err'),cur=$('w-cur').value,nw=$('w-new').value;
    if(!cur)return e3.textContent='Enter your current password.';if(nw.length<8)return e3.textContent='Use at least 8 characters.';if(nw===cur)return e3.textContent='Choose a password different from the current one.';
    if(nw!==$('w-con').value)return e3.textContent='The two new passwords do not match.';
    go(function(){return api('POST','/password',{current:cur,next:nw});},function(){toast('Password changed.');},'w-err');}
});
function afterRender(){if(S.screen==='payroll')payCalc();}
render();
api('GET','/config').then(function(c){useRegion(c.region,c.company);}).catch(function(){})
  .then(function(){if(!TOKEN)return;return refresh().catch(function(e){if(e.status===401){TOKEN='';store('opsnest-token','');}});})
  .then(function(){S.busy=false;render();});
})();
</script>

</body></html>
